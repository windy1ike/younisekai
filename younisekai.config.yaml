# ==============================================================================
# younisekai 站点配置
# ------------------------------------------------------------------------------
# 1. 配置在构建时由 src/config.ts 读取并做归一化处理，修改后需重新构建 (或重启开发服务器)
# 2. 每一项都配有中文注释，按注释说明修改即可，不要随意增删层级
# 3. 导航栏可直接书写链接预设名 (Home / Archive / Projects / ...)，
#    预设定义位于 src/constants/link-presets.ts
# ==============================================================================

# 站点配置
site:
    # 站点 URL（以斜杠结尾）
    # 注意：部署前请务必改成你自己的域名，否则 RSS / Atom / OG 等会指向错误地址
    siteURL: "https://younisekai.example.com/"
    # 站点标题
    title: "younisekai"
    # 站点副标题
    subtitle: "异世界手记"
    # 语言配置
    # 可选值为 src/i18n/language.ts 中已内置翻译的语言：en / ja / zh_hans / zh_hant
    # 地区写法 (如 zh_CN / zh_TW) 会自动归一化到对应语言
    lang: "zh_CN"
    # 站点关键词，用于生成 <meta name="keywords">
    keywords:
        - "younisekai"
        - "异世界手记"
        - "博客"
        - "Astro"
    # 时区配置 (UTC 偏移小时数，范围 -12 ~ 12)
    timeZone: 8
    # 字体配置
    font:
        # 字体项标识，会用于生成 .font-<标识> 工具类，请勿包含空格
        NotoSansSC:
            # 字体源 (字体 CSS 链接 | 字体文件路径)
            src: "https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap"
            # 字体名 (font-family)
            family: "Noto Sans SC"
    # 主题色配置
    themeColor:
        # 主题色的默认色相 (范围从 0 到 360。例如：红色：0，青色：200，蓝绿色：250，粉色：345)
        hue: 265
    # 默认主题 ("system" 跟随系统 | "light" 浅色 | "dark" 深色)
    defaultTheme: "dark"
    # 壁纸配置
    wallpaper:
        # 模式 ("banner" 横幅 | "fullscreen" 全屏 | "none" 纯色)
        mode: "banner"
        # 图片源配置 (fullscreen 和 banner 模式共享)
        src:
            # 桌面壁纸图片 (相对于 /public 目录; 支持单张图片或图片数组，当数组长度 > 1 时自动启用轮播)
            desktop:
                - "/assets/images/desktopWallpaper_1.svg"
                - "/assets/images/desktopWallpaper_2.svg"
                - "/assets/images/desktopWallpaper_3.svg"
            # 移动壁纸图片 (相对于 /public 目录; 支持单张图片或图片数组，当数组长度 > 1 时自动启用轮播)
            mobile:
                - "/assets/images/mobileWallpaper_1.svg"
                - "/assets/images/mobileWallpaper_2.svg"
        # 壁纸位置 ('top' | 'center' | 'bottom')
        position: "center"
        # 轮播配置 (fullscreen 和 banner 模式共享)
        carousel:
            # 为多张图片启用轮播，否则随机显示一张图片
            enable: true
            # 轮播间隔时间 (秒)
            interval: 6
            # 启用 Ken Burns 效果
            kenBurns: true
        # Banner 模式专属配置
        banner:
            # 横幅文本配置
            homeText:
                # 在主页显示文本
                enable: true
                # 主标题
                title: "younisekai"
                # 副标题，支持单个字符串或字符串数组 (数组会依次轮播)
                subtitle:
                    - "在星轨尽头，写下每一次思绪的涟漪"
                    - "代码、文字与影像，都是异世界的坐标"
                    - "愿这里成为你我共同的书签"
                # 副标题打字机效果
                typewriter:
                    # 启用副标题打字机效果
                    enable: true
                    # 打字速度 (毫秒)
                    speed: 111
                    # 删除速度 (毫秒)
                    deleteSpeed: 51
                    # 完全显示后的暂停时间 (毫秒)
                    pauseTime: 3000
            # 横幅图片来源文本
            credit:
                # 显示横幅图片来源文本
                enable: false
                # 要显示的来源文本
                text: ""
                # (可选) 原始艺术品或艺术家页面的 URL 链接
                url: ""
            # 导航栏配置
            navbar:
                # 导航栏透明模式 ("semi" 半透明加圆角 | "full" 完全透明 | "semifull" 动态透明)
                transparentMode: "semifull"
            # 水波纹效果配置
            waves:
                # 启用水波纹效果
                enable: true
                # 启用性能模式 (简化波浪效果以提升性能)
                performanceMode: false
        # Fullscreen 模式专属配置
        fullscreen:
            # 层级
            zIndex: -1
            # 壁纸透明度，0-1之间
            opacity: 0.9
            # 背景模糊程度 (像素值)
            blur: 1
            # 导航栏透明模式
            navbar:
                transparentMode: "semi"
    # 加载页配置
    loadingOverlay:
        # 是否启用加载页
        enable: true
        # 揭开加载页前是否等待字体加载完成
        waitForFonts: true
        # 揭开加载页前是否等待首屏图片 (如壁纸/头像) 解码完成
        waitForImages: true
        # 加载页最长等待时间 (s)
        maxWait: 3
        # 加载标题配置
        title:
            # 是否启用加载标题
            enable: true
            # 加载标题文本
            content: "LOADING"
            # 动画周期 (s)
            interval: 1.5
        # 加载动画配置
        spinner:
            # 是否启用加载动画
            enable: true
            # 动画周期 (s)
            interval: 1.5
    # favicon 配置 (留空即使用 src/constants/icon.ts 中的默认图标)
    favicon:
        - # 浅色主题图标
            # 图标路径 (相对于 /public 目录)
            src: "/favicon/icon-light.svg"
            # 适用主题 ("light" | "dark")
            theme: "light"
            # 图标尺寸 (SVG 矢量图使用 "any")
            sizes: "any"
        - # 深色主题图标
            # 图标路径 (相对于 /public 目录)
            src: "/favicon/icon-dark.svg"
            # 适用主题 ("light" | "dark")
            theme: "dark"
            # 图标尺寸 (SVG 矢量图使用 "any")
            sizes: "any"

# 导航栏配置
navbar:
    # 链接配置 (链接预设位于 src/constants/link-presets.ts 的 LinkPresets)
    links:
        - # 一级导航链接 - 主页 (预设)
            "Home"
        - # 一级导航链接 - 归档 (预设)
            "Archive"
        - # 一级导航链接 - 展览 (自定义，点击后进入中转页)
            # 导航名称
            name: "展览"
            # 导航链接
            url: "/exhibition/"
            # 导航图标
            icon: "material-symbols:person"
            # 导航描述
            description: "收藏我的创作、技能与旅途片段"
            # 子链接
            children:
                - # 二级导航链接 - 项目 (预设)
                    "Projects"
                - # 二级导航链接 - 技能 (预设)
                    "Skills"
                - # 二级导航链接 - 历程 (预设)
                    "Timeline"
                - # 二级导航链接 - 日记 (预设)
                    "Diary"
                - # 二级导航链接 - 相册 (预设)
                    "Albums"
        - # 一级导航链接 - 好友 (预设)
            "Friends"
        - # 一级导航链接 - 关于 (预设)
            "About"

# 侧边栏配置
sidebar:
    # 侧边栏组件配置列表 (侧栏组件预设位于 src/types/config.ts 的 WidgetComponentType)
    components:
        # 左侧侧边栏
        left:
            - # 组件 - 目录 (预设)
                # 类型
                type: "directory"
                # 位置策略 ("top" 顶部固定 | "sticky" 粘性)
                position: "sticky"
            - # 组件 - 文章类别 (预设)
                # 类型
                type: "categories"
                # 位置策略 ("top" 顶部固定 | "sticky" 粘性)
                position: "sticky"
                # 响应式配置
                responsive:
                    # 折叠阈值
                    collapseThreshold: 5
                # 目录深度
                depth: 3
            - # 组件 - 文章标签 (预设)
                # 类型
                type: "tags"
                # 位置策略 ("top" 顶部固定 | "sticky" 粘性)
                position: "sticky"
                # 响应式配置
                responsive:
                    # 折叠阈值
                    collapseThreshold: 20
        # 右侧侧边栏
        right:
            - # 组件 - 资料 (预设)
                # 类型
                type: "profile"
                # 位置策略 ("top" 顶部固定 | "sticky" 粘性)
                position: "top"
                # 页面可见性配置
                visibility:
                    # 匹配模式：'include' (包含), 'exclude' (排除)
                    mode: "exclude"
                    # 页面路径匹配规则列表 (支持正则字符串)
                    paths: ["^/posts/", "^/archive"]
            - # 组件 - 公告 (预设)
                # 类型
                type: "announcement"
                # 位置策略 ("top" 顶部固定 | "sticky" 粘性)
                position: "top"
                # 页面可见性配置
                visibility:
                    # 匹配模式：'include' (包含), 'exclude' (排除)
                    mode: "exclude"
                    # 页面路径匹配规则列表 (支持正则字符串)
                    paths: ["^/posts/", "^/archive"]
            - # 组件 - 文章目录 (预设)
                # 类型
                type: "toc"
                # 位置策略 ("top" 顶部固定 | "sticky" 粘性)
                position: "sticky"
                # 目录深度 (1-6，1 表示只显示 h1 标题，2 表示显示 h1 和 h2 标题，依此类推)
                depth: 3
            - # 组件 - 站点统计 (预设)
                # 类型
                type: "statistics"
                # 位置策略 ("top" 顶部固定 | "sticky" 粘性)
                position: "sticky"
                # 页面可见性配置
                visibility:
                    # 匹配模式：'include' (包含), 'exclude' (排除)
                    mode: "include"
                    # 页面路径匹配规则列表 (支持正则字符串)
                    paths: ["^/$", "^/archive$"]

# 资料配置
profile:
    # 头像配置 (相对于 /public 目录)
    avatar: "/assets/images/avatar.svg"
    # 信息配置
    name: "younisekai"
    # 简介配置
    bio: "在异世界的间隙里，写点代码，也写点故事。"
    # 链接配置
    links:
        - # 链接示例 - GitHub
            # 名字
            name: "GitHub"
            # 图标
            icon: "fa6-brands:github"
            # 链接 (占位地址，记得改成你自己的仓库)
            url: "https://github.com/yourname/younisekai"
        - # 链接示例 - RSS
            # 名字
            name: "RSS"
            # 图标
            icon: "fa6-solid:rss"
            # 链接
            url: "/rss.xml"
        - # 链接示例 - Atom
            # 名字
            name: "Atom"
            # 图标
            icon: "fa6-solid:at"
            # 链接
            url: "/atom.xml"

# 公告配置
announcement:
    # 公告标题
    title: "异世界公告"
    # 公告内容
    content: "欢迎来到 younisekai，这里记录着我的代码、文字与旅途。"
    # 允许用户关闭公告
    closable: true
    # 链接配置
    link:
        # 启用链接
        enable: true
        # 链接文本
        text: "了解更多"
        # 链接 URL
        url: "/about/"
        # 是否外部链接
        external: false

# 文章配置
post:
    # 文章卡片配置
    card:
        # 封面
        cover:
            # 位置 ("left" | "right")
            side: "left"
            # 封面宽度
            width: "33%"
            # 封面上是否显示文字 (标题、标签、摘要)
            showContent: true
            # 无指定封面时是否显示默认封面
            showDefaultCover: true
        # 标题大小 (Tailwind 文本大小类，例如 "text-3xl")
        titleSize: "text-2xl"
    # 显示"上次编辑"卡片
    showLastModified: true
    # 代码高亮配置
    expressiveCode:
        # 主题
        theme: "github-dark"
    # 许可证配置
    license:
        # 启用许可证
        enable: true
        # 许可证名称
        name: "CC BY-NC-SA 4.0"
        # 许可证链接
        url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"
    # 评论配置
    comment:
        # 启用评论功能
        enable: false
        # 评论服务提供商 ("waline" | "twikoo") 不填则自动选择已配置的服务
        provider:
        # Waline 评论系统配置
        # 填写方式：把 serverURL 改成你自己的 Waline 服务端地址 (如 "https://waline.example.com")，
        # 再把上面的 enable 改为 true 即可；provider 留空时会自动选中已填写必填项的服务
        waline:
            # 服务端地址
            serverURL: ""
            # 语言 (留空则使用站点语言)
            lang: ""
        # Twikoo 评论系统配置
        # 填写方式：把 envId 改成你的 Twikoo 环境 ID，并把上面的 enable 改为 true 即可
        twikoo:
            # 环境 ID
            envId: ""
            # 语言 (留空则使用站点语言)
            lang: ""

# 页脚配置
footer:
    # 启用 Footer HTML 注入功能
    enable: false
    # 自定义 HTML 内容，用于添加备案号等信息
    customHtml: ""

# 粒子特效配置
particle:
    # 启用粒子特效
    enable: true
    # 粒子数量
    particleNum: 12
    # 粒子越界限制次数，-1为无限循环
    limitTimes: -1
    # 粒子尺寸配置
    size:
        # 粒子最小尺寸倍数
        min: 0.3
        # 粒子最大尺寸倍数
        max: 0.9
    # 粒子透明度配置
    opacity:
        # 粒子最小不透明度
        min: 0.3
        # 粒子最大不透明度
        max: 0.9
    # 粒子移动速度配置
    speed:
        # 水平移动速度
        horizontal:
            # 最小值
            min: -0.9
            # 最大值
            max: 0.9
        # 垂直移动速度
        vertical:
            # 最小值
            min: 0.15
            # 最大值
            max: 0.3
        # 旋转速度
        rotation: 0.12
        # 消失速度
        fadeSpeed: 0.12
    # 粒子层级
    zIndex: 100

name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间提出建议！请尽量说明使用场景，方便评估。
  - type: textarea
    id: related-problem
    attributes:
      label: 这个建议是否与某个问题相关？
      description: 请清晰简洁地描述遇到的问题，例如「我每次都要手动做某件事时很麻烦」。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 请描述你希望如何实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 请描述你考虑过的替代方案或变通做法。
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 任何其他说明、截图或参考链接。

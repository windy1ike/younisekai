# 推送到 main 分支时自动构建并发布到 GitHub Pages
#
# 使用前：
#   1. 仓库 Settings → Pages → Source 选择 "GitHub Actions"
#   2. 把 astro.config.mjs 里的 site 改成自己的地址
#      项目站点（https://<用户名>.github.io/<仓库名>/）还需要设置 base: '/<仓库名>'
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

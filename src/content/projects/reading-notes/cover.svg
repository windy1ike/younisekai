<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="younisekai cover">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="hsl(329 58% 18%)"/>
            <stop offset="100%" stop-color="hsl(394 70% 42%)"/>
        </linearGradient>
        <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="84"/>
        </filter>
        <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M60 0 L0 0 0 60" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="1"/>
        </pattern>
        <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="60" result="n"/>
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
        </filter>
    </defs>
    <rect width="1200" height="630" fill="url(#bg)"/>
    <g filter="url(#blur)"><circle cx="887.14" cy="595.32" r="533.68" fill="hsl(5.21 82% 53.53%)" opacity="0.29"/><circle cx="711.66" cy="539.4" r="271" fill="hsl(339.05 82% 52.45%)" opacity="0.38"/><circle cx="267.73" cy="91.35" r="584.64" fill="hsl(6.85 82% 56.57%)" opacity="0.38"/></g>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <rect width="1200" height="630" filter="url(#grain)" opacity="0.6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="younisekai cover">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="hsl(346 58% 18%)"/>
            <stop offset="100%" stop-color="hsl(411 70% 42%)"/>
        </linearGradient>
        <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="84"/>
        </filter>
        <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M60 0 L0 0 0 60" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="1"/>
        </pattern>
        <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="16" result="n"/>
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
        </filter>
    </defs>
    <rect width="1200" height="630" fill="url(#bg)"/>
    <g filter="url(#blur)"><circle cx="877.58" cy="456.34" r="495.01" fill="hsl(342.86 82% 68.57%)" opacity="0.56"/><circle cx="500.19" cy="278.35" r="403.77" fill="hsl(47.52 82% 52.88%)" opacity="0.3"/><circle cx="1136.96" cy="173.15" r="493.06" fill="hsl(326.69 82% 62.53%)" opacity="0.35"/></g>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <rect width="1200" height="630" filter="url(#grain)" opacity="0.6"/>
</svg>

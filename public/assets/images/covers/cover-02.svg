<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="younisekai cover">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="hsl(238 58% 18%)"/>
            <stop offset="100%" stop-color="hsl(303 70% 42%)"/>
        </linearGradient>
        <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="84"/>
        </filter>
        <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M60 0 L0 0 0 60" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="1"/>
        </pattern>
        <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="6" result="n"/>
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
        </filter>
    </defs>
    <rect width="1200" height="630" fill="url(#bg)"/>
    <g filter="url(#blur)"><circle cx="303.75" cy="231.08" r="614.61" fill="hsl(257.14 82% 52.95%)" opacity="0.31"/><circle cx="447.41" cy="177.37" r="503.5" fill="hsl(297.79 82% 59.91%)" opacity="0.56"/><circle cx="709.05" cy="451.89" r="514.2" fill="hsl(250.53 82% 60.77%)" opacity="0.56"/></g>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <rect width="1200" height="630" filter="url(#grain)" opacity="0.6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="younisekai cover">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="hsl(244 58% 18%)"/>
            <stop offset="100%" stop-color="hsl(309 70% 42%)"/>
        </linearGradient>
        <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="84"/>
        </filter>
        <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M60 0 L0 0 0 60" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="1"/>
        </pattern>
        <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="13" result="n"/>
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
        </filter>
    </defs>
    <rect width="1200" height="630" fill="url(#bg)"/>
    <g filter="url(#blur)"><circle cx="740.07" cy="75.92" r="503.14" fill="hsl(260.78 82% 63.44%)" opacity="0.44"/><circle cx="282.02" cy="218.46" r="388.36" fill="hsl(278.49 82% 55.87%)" opacity="0.29"/><circle cx="569.42" cy="484.3" r="420.95" fill="hsl(251.32 82% 55.74%)" opacity="0.56"/></g>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <rect width="1200" height="630" filter="url(#grain)" opacity="0.6"/>
</svg>

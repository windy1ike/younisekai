# ==============================================================================
# YouniSekai 站点配置 —— 后台可改的部分（Sveltia / Decap CMS 的「站点设置」写的就是这个文件）
#
# 为什么单独放一个文件？
#   younisekai.config.yaml 是带详细中文注释的主配置，适合直接改文件；
#   而后台编辑器保存时会重写整个文件（注释会丢），所以这里单独放一份「覆盖层」：
#   后台只改这个文件，主配置的注释与结构保持不动。
#
# 合并规则（见 src/config.ts）：
#   · 本文件里出现的键会覆盖主配置里的同名键（对象递归合并，数组整体替换）
#   · 留空 / 不写某个键 → 就用主配置里的值
#   · 空数组（例如 links: []）会被忽略，避免"后台没填就把主配置的菜单清空"
#     —— 想彻底清空某个列表，请去 younisekai.config.yaml 里删
#
# 能在这里改的：站点信息（标题/副标题/关键词/主题色相/默认深浅色）、导航菜单、
#              侧栏挂件、资料卡、公告
# 仍要改主配置的：壁纸、字体、加载页、文章卡片样式、许可证、评论服务、页脚、粒子特效
# ==============================================================================

